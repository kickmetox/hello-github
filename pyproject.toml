[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossos"
version = "0.1.0"
description = "CrossOS Intelligent Workflow & System Sync — lokale Übersetzung, Diagnose und Hardwareprofile"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "CrossOS"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
crossos = "crossos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
